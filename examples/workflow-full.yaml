# Complete LaunchDarkly Migration Workflow
# Runs all steps: extract source → map members → migrate
# This is the DEFAULT behavior if workflow.steps is not specified

# Optional: Explicitly define steps (if omitted, runs all steps by default)
# workflow:
#   steps:
#     - extract-source
#     - map-members
#     - migrate

# Optional: TLS settings for corporate proxy environments
# tls:
#   caStore: "system"              # Use OS certificate store (DENO_TLS_CA_STORE)
#   certFile: "/path/to/ca.pem"   # Custom CA certificate (DENO_CERT)
#   ignoreCertErrors: true         # Disable TLS verification (not recommended for production)

source:
  projectKey: us-production
  # allProjects: true        # Migrate ALL projects from source account (overrides projectKey)
  domain: app.launchdarkly.com  # Optional: Defaults to app.launchdarkly.com

destination:
  projectKey: eu-production
  domain: app.launchdarkly.com  # Optional: Use app.eu.launchdarkly.com for EU instance

# Optional: Control what data to extract from source
# extraction:
#   includeSegments: true  # Uncomment to extract segments (only needed if migrateSegments: true)

# Optional: Configure member mapping output location
memberMapping:
  outputFile: data/launchdarkly-migrations/mappings/maintainer_mapping.json

# Migration configuration
migration:
  # Use the member mapping we just created
  assignMaintainerIds: true
  
  # Include segments
  migrateSegments: true
  
  # Handle conflicts
  conflictPrefix: "us-"
  
  # Organize in view
  targetView: "us-migration-2024"
  
  # Only migrate these environments
  environments:
    - production
    - staging
  
  # Map environment keys if needed
  environmentMapping:
    production: production
    staging: staging

  # Auto-create destination project if it doesn't exist (uses source project name)
  # createProject: true

  # Auto-create missing environments on destination from source metadata
  # createEnvironments: true

  # Optional: Transform rule clause values during migration.
  # Each entry replaces or removes matching clauses in rules.
  # 'attribute' is optional — if omitted, matches values in any clause attribute.
  # 'action' defaults to "replace". Use "remove" to drop matching clauses entirely.
  # ruleValueReplacements:
  #   - attribute: "versionName"
  #     action: "remove"                # drops any clause targeting versionName
  #   - attribute: "versionName"
  #     match: "26.3.30"
  #     replace: "1.0.0"               # replaces 26.3.30 -> 1.0.0 in versionName clauses
  #   - match: "CVS"
  #     replace: "Health100"           # replaces CVS -> Health100 in any clause

